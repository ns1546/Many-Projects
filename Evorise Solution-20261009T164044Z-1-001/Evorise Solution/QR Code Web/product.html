<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dish Details</title>
  <script>
    // Smoothly forward to the unified, rich detail.html page
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (id) {
      window.location.replace('detail.html?type=item&id=' + encodeURIComponent(id));
    } else {
      window.location.replace('index.html');
    }
  </script>
</head>
<body>
  <p style="font-family:sans-serif; text-align:center; padding:50px; color:#64748B;">
    Loading dish details...
  </p>
</body>
</html>
