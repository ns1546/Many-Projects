version: '3.8'

services:
  # 1. Primary Transactional Database (System of Record)
  postgres:
    image: postgres:16-alpine
    container_name: evorise-postgres
    environment:
      POSTGRES_USER: evorise_admin
      POSTGRES_PASSWORD: supersecurepassword123
      POSTGRES_DB: evorise_orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evorise-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evorise_admin -d evorise_orders"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Session Tracking, Caching, Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: evorise-redis
    command: redis-server --maxmemory 1gb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - evorise-net

  # 3. Zookeeper (Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: evorise-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - evorise-net

  # 4. Apache Kafka (Event-Driven Spike Absorption)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: evorise-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - evorise-net

  # 5. ClickHouse (High-Speed Analytics Engine)
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: evorise-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - evorise-net
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:

networks:
  evorise-net:
    driver: bridge
