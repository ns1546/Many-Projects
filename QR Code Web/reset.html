<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset App Data</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f3f4f6; }
    .box { background: #fff; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 400px; }
    h2 { color: #111827; margin-bottom: 8px; }
    p { color: #6b7280; margin-bottom: 24px; }
    button { background: #DC2626; color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:hover { background: #b91c1c; }
    .success { color: #16A34A; font-weight: 700; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🔄 Reset App Data</h2>
    <p>This clears all localStorage data and reloads the app with fresh demo content. Use this if settings are broken or demo items are not showing.</p>
    <button onclick="resetAll()">Clear & Reset Everything</button>
    <div class="success" id="msg">✅ Done! Redirecting to homepage...</div>
  </div>
  <script>
    function resetAll() {
      localStorage.clear();
      document.getElementById('msg').style.display = 'block';
      setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    }
  </script>
</body>
</html>
