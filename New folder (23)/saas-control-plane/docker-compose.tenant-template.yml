version: '3.8'

services:
  api:
    image: ghcr.io/saleor/saleor:3.19
    restart: unless-stopped
    ports:
      - "${TENANT_API_PORT}:8000"
    env_file:
      - .env.tenant
    environment:
      - DATABASE_URL=postgres://${TENANT_DB_USER}:${TENANT_DB_PASSWORD}@db:5432/${TENANT_DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${TENANT_DOMAIN},localhost
      - SECRET_KEY=${TENANT_SECRET_KEY}
    depends_on:
      - db
      - redis

  worker:
    image: ghcr.io/saleor/saleor:3.19
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    restart: unless-stopped
    env_file:
      - .env.tenant
    environment:
      - DATABASE_URL=postgres://${TENANT_DB_USER}:${TENANT_DB_PASSWORD}@db:5432/${TENANT_DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${TENANT_SECRET_KEY}
    depends_on:
      - redis
      - db

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${TENANT_DB_USER}
      - POSTGRES_PASSWORD=${TENANT_DB_PASSWORD}
      - POSTGRES_DB=${TENANT_DB_NAME}
    volumes:
      - ${TENANT_DB_VOLUME}:/var/lib/postgresql/data

  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    volumes:
      - ${TENANT_REDIS_VOLUME}:/data
