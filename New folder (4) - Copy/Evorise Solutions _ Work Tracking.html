            .login-success #glyph-left { animation: orbital-converge-left 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards; }

            @keyframes orbital-converge-left {

        function migrateToTaskModel() {
            console.log("Migrating to new task model...");
            const newTasks = [];
            let taskIdCounter = Math.max(0, ...(state.tasks || []).map(t => t.id)) + 1;

            state.services.forEach(service => {
                const existingTaskCount = (state.tasks || []).filter(t => t.serviceId === service.id).length;
                for (let i = existingTaskCount; i < service.total; i++) {
                    newTasks.push({
                        id: taskIdCounter++,
                        serviceId: service.id,
                        sequence: i + 1,
                        status: 'todo',
                        assignedTo: null,
                        customName: null,
                        customDeadline: null,
                        // Add new fields for advanced details
                        description: '',
                        subtasks: [],
                        comments: [],
                        attachments: []
                    });
                }
            });

            state.tasks = [...(state.tasks || []), ...newTasks];

            // Ensure all existing tasks have the new fields
            state.tasks.forEach(task => {
                if (task.sequence === undefined) {
                    const tasksForService = state.tasks.filter(t => t.serviceId === task.serviceId).sort((a, b) => a.id - b.id);
                    const taskIndex = tasksForService.findIndex(t => t.id === task.id);
                    task.sequence = taskIndex + 1;
                }
                if (task.subtasks === undefined) task.subtasks = [];
                if (task.comments === undefined) task.comments = [];
                if (task.attachments === undefined) task.attachments = [];
                if (task.description === undefined) task.description = '';
                if (task.customName === undefined) task.customName = null;
                if (task.customDeadline === undefined) task.customDeadline = null;
            });

            state.workLog.forEach(log => {
                if (log.taskId) return;
                const user = state.users.find(u => u.name === log.doneBy);
                const taskToMark = state.tasks.find(t => t.serviceId === log.serviceId && t.status === 'todo' && !t.assignedTo);
                if (taskToMark) {
                    taskToMark.status = 'done';
                    taskToMark.assignedTo = user ? user.id : null;
                    log.taskId = taskToMark.id;
                }
            });
            state.services.forEach(s => delete s.assignments);
            // No saveState() here, it will be called by the function that invokes migrate
            console.log("Migration complete.");
        }

        async function persistStateToFirebase() {
            try {
                const user = auth.currentUser;
                // Check if user is logged in AND if we have a valid state to save
                if (!user || !db || !state.companyInfo) {
                    // console.warn("⚠️ Cannot save: no user/db connection or invalid state.");
                    return;
                }

                // OPTIMIZATION: Truncate logs to prevent state bloat and performance lag
                if (state.auditLog && state.auditLog.length > 500) state.auditLog = state.auditLog.slice(-500);
                if (state.sessionLogs && state.sessionLogs.length > 100) state.sessionLogs = state.sessionLogs.slice(-100);

                // Create a 'sharedState' object containing only the data that needs to be synced.
                const sharedState = {
                    companyInfo: state.companyInfo,
                    ourAgencyDetails: state.ourAgencyDetails,
                    onboardingTemplate: state.onboardingTemplate,
                    users: state.users,
                    clients: state.clients,
                    services: state.services,
                    tasks: state.tasks,
                    notifications: state.notifications,
                    workLog: state.workLog,
                    undoRequests: state.undoRequests,
                    calendarEvents: state.calendarEvents,
                    passwordResetRequests: state.passwordResetRequests,
                    auditLog: state.auditLog || [],
                    agencies: state.agencies,
                    onboardingWorkflows: state.onboardingWorkflows,
                    sessionLogs: state.sessionLogs || [],
                    messages: state.messages,
                    kanbanFilters: state.kanbanFilters,
                    instantWork: state.instantWork || [],
                    settings: state.settings,
                };

                // console.log("💾 Persisting data to Firestore...");
                await setDoc(doc(db, "app_data", "main_app_state"), sharedState);
                // console.log("✅ Data successfully persisted.");

            } catch (error) {
                console.error("❌ Error saving to Firestore:", error);

        function resizeImage(file, maxWidth, callback) {
            const reader = new FileReader();
            reader.onload = function (event) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round(height * (maxWidth / width));
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Compress to JPEG with 0.7 quality for max efficiency
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function processNovaFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            const audioExts = ['mp3', 'wav', 'm4a', 'webm', 'ogg', 'flac', 'mpeg'];
            const textExts = ['txt', 'csv', 'json', 'md', 'log', 'xml', 'html', 'css', 'js'];

            // Audio files → Whisper transcription
            if (audioExts.includes(ext)) {
                if (file.size > 25 * 1024 * 1024) {
                    throw new Error('Audio file too large. Maximum 25MB for transcription.');
                }
                showToastNotification({ text: '🎙️ Transcribing audio with Whisper AI...', type: 'info' });
                const result = await transcribeAudioWithWhisper(file);
                const durationMin = result.duration ? (result.duration / 60).toFixed(1) : '?';
                return {
                    type: 'audio',
                    fileName: file.name,
                    content: result.text,
                    meta: `Duration: ${durationMin} minutes`,
                    prompt: `The user uploaded an audio/meeting recording named "${file.name}" (${durationMin} min). Here is the full transcription:\n\n"${result.text}"\n\nPlease provide:\n1. A comprehensive summary of the key points discussed\n2. Any action items or decisions made\n3. Important quotes or statements`
                };
            }

            // Text-based files → FileReader
            if (textExts.includes(ext)) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const content = e.target.result;
                        const truncated = content.length > 15000 ? content.substring(0, 15000) + '\n\n[...truncated]' : content;

                        // 🧠 RAG: Store document in memory
                        if (!state.novaDocuments) state.novaDocuments = {};
                        state.novaDocuments[file.name] = truncated;
                        saveStateImmediate();

                        resolve({
                            type: 'text',
                            fileName: file.name,
                            content: truncated,
                            meta: `${(file.size / 1024).toFixed(1)} KB`,
                            prompt: `The user uploaded "${file.name}". I have indexed its content in my memory. Summarize it briefly.`
                        });
                    };
                    reader.onerror = () => reject(new Error('Failed to read file'));
                    reader.readAsText(file);
                });
            }

            // PDF files → basic extraction attempt
            if (ext === 'pdf') {
                return {
                    type: 'pdf',
                    fileName: file.name,
                    content: '[PDF content - browser extraction limited]',
                    meta: `${(file.size / 1024).toFixed(1)} KB`,
                    prompt: `The user uploaded a PDF file named "${file.name}" (${(file.size / 1024).toFixed(1)} KB). Unfortunately, I cannot directly read PDF content in the browser. Please acknowledge the file and ask the user to copy-paste the text content they'd like analyzed, or suggest converting it to a text format.`
                };
            }

            // Unsupported
            throw new Error(`Unsupported file type: .${ext}. Supported: text files (txt, csv, json, etc.), audio files (mp3, wav, m4a), and PDF.`);
        }

        function addNotification(notification) {
            // 1. Add to the main state.notifications list (for the header bell)
            state.notifications.push(notification);

                adminUsers.forEach(admin => {
                    // Create a unique notification instance for each admin

        function createNotification({ userId, text, link, type = 'info', fromUserId = null }) {
            const newNotification = {
                id: Math.max(0, ...state.notifications.map(n => n.id)) + 1,
                userId: userId,
                text: text,
                link: link,
                type: type,
                read: false,
                timestamp: new Date().toISOString(),
                fromUserId: fromUserId
            };
            state.notifications.push(newNotification);

            // --- SEND PUSH NOTIFICATION to other devices ---
            // Only send push if it's not a notification for the current logged-in user's own action
            if (state.loggedInUser && userId !== state.loggedInUser.id) {
                const senderName = state.loggedInUser ? state.loggedInUser.name : 'System';
                sendPushNotification(userId, `New notification from ${senderName}`, text, { link });
            }
            // --- END PUSH NOTIFICATION ---

            // Sync with Bubble if exists
            const user = state.users.find(u => u.id === userId);
            if (user && user.bubbleSettings) {
                if (!user.bubbleSettings.notifications) user.bubbleSettings.notifications = [];
                user.bubbleSettings.notifications.push(newNotification);
                user.bubbleSettings.unreadCount = (user.bubbleSettings.unreadCount || 0) + 1;
                if (!user.bubbleSettings.isSilenced && !user.bubbleSettings.isOpen) user.bubbleSettings.isOpen = true;
            }

            // Real-time Alerts
            if (state.loggedInUser && state.loggedInUser.id === userId) {

        function checkDeadlines() {
            // Respect notification settings
            const ns = (state.settings && state.settings.notificationSettings) || {};
            if (ns.enableDeadlineNotifs === false) return;
            const warningDays = ns.deadlineWarningDays || 2;

            const now = new Date();
            const warningWindow = new Date(now.getTime() + warningDays * 24 * 60 * 60 * 1000);

            state.services.forEach(service => {
                if (!service.deadline) return;
                const deadline = new Date(service.deadline);
                const completed = getCompletedCount(service.id);
                if (completed >= service.total) return;

                let message = '';
                if (deadline < now) {
                    message = `Task "${service.name}" is overdue!`;
                } else if (deadline <= warningWindow) {
                    message = `Task "${service.name}" is due on ${formatDate(service.deadline)}.`;
                }
                if (message) {
                    const adminUsers = state.users.filter(u => u.role === 'Admin');
                    adminUsers.forEach(user => {
                        // Deduplication: skip if an identical notification already exists
                        const alreadyExists = state.notifications.some(n =>
                            n.userId === user.id && n.text === message && n.type === 'deadline'
                        );
                        if (!alreadyExists) {
                            createNotification({
                                userId: user.id,
                                text: message,
                                link: 'adminDashboard',
                                type: 'deadline'
                            });
                        }
                    });
                }
            });
            saveState();
        }

            // Respect notification settings (but allow explicit Nova/tool toasts through)

            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            if (type === 'deadline') {
                toast.classList.add('border-l-4', 'border-red-500');

            // Ensure ICONS is available, otherwise fallback
            const icon = (typeof ICONS !== 'undefined' && ICONS.bell) ? (type === 'deadline' ? ICONS.alertCircle : ICONS.bell) : '<span>!</span>';

            toast.innerHTML = `

                    <p class="text-sm font-medium">${text}</p>

            // Animation handling
            requestAnimationFrame(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateX(0)';
            });

            setTimeout(() => {
                toast.style.opacity = '0';

                toast.remove();
            });
        }

            if (!targetUser) return;

        const formatDate = (isoString) => isoString ? new Date(isoString).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'N/A';
        const formatDateTime = (isoString) => new Date(isoString).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
        const getCompletedCount = (serviceId) => state.tasks.filter(t => t.serviceId === serviceId && t.status === 'done').length;

                case 'Low': return 'bg-gray-500 text-white';
                default: return 'bg-gray-400 text-white';
            }
        };
        const formatRelativeTime = (isoString) => {
            const date = new Date(isoString);
            const now = new Date();
            const diffInSeconds = (date - now) / 1000;
            const diffInMinutes = diffInSeconds / 60;
            const diffInHours = diffInMinutes / 60;
            const diffInDays = diffInHours / 24;

            if (Math.abs(diffInDays) > 7) {
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }

            const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });

            if (Math.abs(diffInDays) >= 1) {
                return rtf.format(Math.round(diffInDays), 'day');
            }
            if (Math.abs(diffInHours) >= 1) {
                return rtf.format(Math.round(diffInHours), 'hour');
            }
            if (Math.abs(diffInMinutes) >= 1) {
                return rtf.format(Math.round(diffInMinutes), 'minute');
            }
            if (diffInSeconds > 0) {
                return `in a few seconds`;
            }
            return `just now`;

        // --- ADD THIS FUNCTION ---

        // --- RENDER FUNCTIONS ---
        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }
        //--Render Login---
        function renderLogin() {
            // --- Fix for Parallax Animation ---
            const shape1 = document.querySelector('.shape1');
            const shape2 = document.querySelector('.shape2');
            if (shape1) shape1.style.animation = 'none';
            if (shape2) shape2.style.animation = 'none';
            // --- End Fix ---

            // Determine greeting based on current time
            const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Dhaka" }));
            const hour = now.getHours();
            let greeting = "Good Evening"; // Default greeting
            if (hour >= 4 && hour < 12) {
                greeting = "Good Morning";
            } else if (hour >= 12 && hour < 18) {
                greeting = "Good Afternoon";
            }

            app.innerHTML = `
        <style>
            .animated-gradient-button {
                background: linear-gradient(270deg, #8b5cf6, #d946ef, #34d399, #fbbf24);
                background-size: 800% 800%;
                animation: gradient-animation 15s ease infinite;
                transition: all 0.3s ease-in-out;
            }
            .animated-gradient-button:hover {
                box-shadow: 0 0 25px rgba(217, 70, 239, 0.6);
                transform: scale(1.02);
            }
            @keyframes gradient-animation { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
            
            /* --- FIX FOR TEXT VISIBILITY --- */
            .login-input:-webkit-autofill,
            .login-input:-webkit-autofill:hover,

            const pageActionsEl = document.getElementById('page-actions');

        function getDeadlineStatus(deadline) {
            if (!deadline) return { text: '', color: 'transparent' };
            const now = new Date();
            const dl = new Date(deadline);
            const diffDays = (dl - now) / (1000 * 60 * 60 * 24);

            if (diffDays < 0) return { text: 'Overdue', color: 'red' };
            if (diffDays <= 7) return { text: 'Nearing Deadline', color: 'yellow' };
            return { text: 'On Track', color: 'green' };
        }

            if (!text) return;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                const voices = window.speechSynthesis.getVoices();
                // Try to find a female/pleasant voice
                const femaleVoice = voices.find(v => v.name.includes('Microsoft Zira') || v.name.includes('Google US English') || v.name.includes('Samantha'));
                if (femaleVoice) utterance.voice = femaleVoice;

                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
                showToastNotification({ text: "🔊 Nova Speaking...", type: 'info' });
            } else {
                console.warn("TTS not supported.");
            }
        };

        function updateAnalyticsDashboard() {
            const startDate = document.getElementById('analytics-date-start').value;
            const endDate = document.getElementById('analytics-date-end').value;
            const clientId = document.getElementById('analytics-client').value;
            const employeeName = document.getElementById('analytics-employee').value;

            // --- FILTER DATA ---
            let filteredLogs = state.workLog.filter(log => log.serviceId !== -1);
            if (startDate) filteredLogs = filteredLogs.filter(log => log.timestamp.split('T')[0] >= startDate);
            if (endDate) filteredLogs = filteredLogs.filter(log => log.timestamp.split('T')[0] <= endDate);
            if (clientId !== 'all') {
                const clientServices = state.services.filter(s => s.clientId == clientId).map(s => s.id);
                filteredLogs = filteredLogs.filter(log => clientServices.includes(log.serviceId));
            }
            if (employeeName !== 'all') {
                filteredLogs = filteredLogs.filter(log => log.doneBy === employeeName);
            }

            // --- CALCULATE & UPDATE KPIs ---
            document.getElementById('kpi-total-tasks').textContent = filteredLogs.length;

            const overdueCount = filteredLogs.filter(log => {
                const service = state.services.find(s => s.id === log.serviceId);
                return service && service.deadline && service.deadline < log.timestamp.split('T')[0];
            }).length;
            document.getElementById('kpi-overdue-tasks').textContent = overdueCount;

            const tasksByEmployee = filteredLogs.reduce((acc, log) => {
                acc[log.doneBy] = (acc[log.doneBy] || 0) + 1;
                return acc;
            }, {});
            const mostActive = Object.entries(tasksByEmployee).sort((a, b) => b[1] - a[1])[0];
            document.getElementById('kpi-most-active').textContent = mostActive ? mostActive[0] : '-';

            const tasksByDay = filteredLogs.reduce((acc, log) => {
                const day = log.timestamp.split('T')[0];
                acc[day] = (acc[day] || 0) + 1;
                return acc;
            }, {});
            const busiestDay = Object.entries(tasksByDay).sort((a, b) => b[1] - a[1])[0];
            document.getElementById('kpi-busiest-day').textContent = busiestDay ? new Date(busiestDay[0]).toLocaleDateString('en-us', { month: 'short', day: 'numeric' }) : '-';

            // --- PREPARE CHART DATA ---
            const chartTextColor = getComputedStyle(document.body).getPropertyValue('--text-color').trim();
            const chartGridColor = 'rgba(255, 255, 255, 0.1)';
            Chart.defaults.color = chartTextColor;

            // 1. Velocity Chart
            const velocityData = {};
            let currentDate = new Date(startDate + 'T00:00:00');
            const finalDate = new Date(endDate + 'T00:00:00');
            while (currentDate <= finalDate) {
                velocityData[currentDate.toISOString().split('T')[0]] = 0;
                currentDate.setDate(currentDate.getDate() + 1);
            }
            filteredLogs.forEach(log => {
                const day = log.timestamp.split('T')[0];
                if (velocityData.hasOwnProperty(day)) velocityData[day]++;
            });

            // 2. Leaderboard Chart
            const leaderboardData = Object.entries(tasksByEmployee).sort((a, b) => a[1] - b[1]);

            // 3. Distribution Chart
            const clientDistribution = filteredLogs.reduce((acc, log) => {
                const service = state.services.find(s => s.id === log.serviceId);
                const client = service ? state.clients.find(c => c.id === service.clientId) : null;
                if (client) {
                    acc[client.name] = (acc[client.name] || 0) + 1;
                }
                return acc;
            }, {});

            // --- DESTROY & RECREATE CHARTS ---
            Object.values(activeCharts).forEach(chart => chart.destroy());

            activeCharts.velocity = new Chart(document.getElementById('velocity-chart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: Object.keys(velocityData).map(d => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })),
                    datasets: [{ label: 'Tasks Completed', data: Object.values(velocityData), backgroundColor: 'rgba(79, 70, 229, 0.7)' }]
                },
                options: { scales: { y: { beginAtZero: true, grid: { color: chartGridColor } }, x: { grid: { color: 'transparent' } } } }
            });

            activeCharts.leaderboard = new Chart(document.getElementById('leaderboard-chart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: leaderboardData.map(item => item[0]),
                    datasets: [{ label: 'Tasks Completed', data: leaderboardData.map(item => item[1]), backgroundColor: 'rgba(16, 185, 129, 0.7)' }]
                },
                options: { indexAxis: 'y', scales: { x: { beginAtZero: true, grid: { color: chartGridColor } }, y: { grid: { color: 'transparent' } } }, plugins: { legend: { display: false } } }
            });

            activeCharts.distribution = new Chart(document.getElementById('distribution-chart').getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(clientDistribution),
                    datasets: [{ data: Object.values(clientDistribution), backgroundColor: ['#4f46e5', '#ec4899', '#10b981', '#f59e0b', '#3b82f6', '#8b5cf6'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
            });
        }

            if (filters.priority !== 'all') {

        function renderCalendar() {
            const today = new Date();
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();

            const firstDayOfMonth = new Date(year, month, 1);
            const lastDayOfMonth = new Date(year, month + 1, 0);

            const startDayOfWeek = firstDayOfMonth.getDay();
            const totalDaysInMonth = lastDayOfMonth.getDate();

            const monthName = calendarDate.toLocaleString('default', { month: 'long' });

            let daysHTML = '';
            // Days from previous month
            for (let i = 0; i < startDayOfWeek; i++) {
                daysHTML += `<div class="calendar-day calendar-day-other-month border-b border-r border-glass-border p-2"></div>`;
            }

            // Days of the current month
            for (let day = 1; day <= totalDaysInMonth; day++) {
                const currentDate = new Date(year, month, day);
                const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
                // FIX: Use local date string components to avoid UTC shifting
                const yearStr = currentDate.getFullYear();
                const monthStr = String(currentDate.getMonth() + 1).padStart(2, '0');
                const dayStr = String(currentDate.getDate()).padStart(2, '0');
                const dateISO = `${yearStr}-${monthStr}-${dayStr}`;

                // --- NEW LOGIC: Check tasks instead of services ---
                // --- NEW LOGIC: Group tasks by priority ---
                const tasksDue = state.tasks.filter(t => {
                    const service = state.services.find(s => s.id === t.serviceId);
                    // Get the effective deadline (task's custom one, or fall back to service's)
                    const effectiveDeadline = t.customDeadline || service.deadline;
                    return effectiveDeadline === dateISO;
                });

                const priorityCounts = { Urgent: 0, High: 0, Medium: 0, Low: 0 };
                tasksDue.forEach(task => {
                    const service = state.services.find(s => s.id === task.serviceId);
                    if (service && priorityCounts.hasOwnProperty(service.priority)) {
                        priorityCounts[service.priority]++;
                    }
                });

                let deadlinesHTML = '';
                if (tasksDue.length > 0) {
                    deadlinesHTML = Object.entries(priorityCounts)
                        .filter(([priority, count]) => count > 0) // Only show priorities that have tasks
                        .map(([priority, count]) => {
                            return `<div class="calendar-event ${getPriorityClasses(priority)}" title="${count} ${priority} task(s) due">
                                        <span class="font-semibold">${count}</span>
                                        <span class="ml-1 text-xs opacity-90">${priority}</span>
                                    </div>`;
                        }).join('');

                    // Add a total count badge
                    deadlinesHTML += `<div class="mt-2 text-center text-xs font-semibold ${isToday ? 'text-indigo-300' : 'text-muted'}">
                                        Total: ${tasksDue.length}
                                     </div>`;
                }
                // --- END OF NEW LOGIC ---

                daysHTML += `
                    <div class="calendar-day calendar-day-interactive border-b border-r border-glass-border p-2 flex flex-col ${isToday ? 'bg-indigo-500/20' : ''}" data-action="view-day-details" data-date="${dateISO}">
                        <div class="font-bold text-sm text-right ${isToday ? 'text-indigo-300' : ''}">${day}</div>
                        <div class="flex-grow space-y-1 mt-1">
                            ${deadlinesHTML}
                        </div>
                    </div>
                `;
            }

            // Days from next month
            const totalCells = startDayOfWeek + totalDaysInMonth;
            const remainingCells = (7 - (totalCells % 7)) % 7;
            for (let i = 0; i < remainingCells; i++) {
                daysHTML += `<div class="calendar-day calendar-day-other-month border-b border-r border-glass-border p-2"></div>`;
            }

            const content = `
                <div class="glass-ui p-6 rounded-lg shadow">
                    <div class="flex justify-between items-center mb-4">
                         <button data-action="prev-month" class="p-2 rounded-full hover:bg-hover-bg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        </button>
                        <h3 class="text-xl font-bold">${monthName} ${year}</h3>
                        <button data-action="next-month" class="p-2 rounded-full hover:bg-hover-bg">
                           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </button>
                    </div>
                    <div class="grid calendar-grid border-l border-t border-glass-border">
                        ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => `<div class="p-2 font-bold text-center border-b border-r border-glass-border">${day}</div>`).join('')}
                        ${daysHTML}
                    </div>
                </div>
            `;
            renderLayout(content, 'Deadlines Calendar');
        }

        function renderEmployeeHistory() {
            // Ensure pagination state exists
            if (!state.pagination) state.pagination = {};
            if (!state.pagination.employeeHistory) state.pagination.employeeHistory = 1;

            const allUserHistory = state.workLog
                .filter(log => log.doneBy === state.loggedInUser.name && log.serviceId !== -1)
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            const itemsPerPage = 50;
            const totalItems = allUserHistory.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const currentPage = state.pagination.employeeHistory;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const historyToShow = allUserHistory.slice(startIndex, endIndex);

            const historyHTML = historyToShow.map(log => {
                const service = state.services.find(s => s.id === log.serviceId);
                const client = service ? state.clients.find(c => c.id === service.clientId) : null;
                const task = state.tasks.find(t => t.id === log.taskId);
                const hasPendingUndo = state.undoRequests.some(r => r.workLogId === log.id && r.status === 'Pending');

                // --- NEW LATE INFO BLOCK ---
                let lateInfoHTML = '';
                if (log.isLate) {
                    lateInfoHTML = `
                        <div class="mt-3 pt-3 border-t border-red-500/30">
                            <p class="text-xs font-semibold text-red-400 uppercase mb-1">Submitted Late</p>
                            <p class="text-sm p-2 bg-black/10 rounded-lg whitespace-pre-wrap">${log.note || 'No reason provided.'}</p>
                            <p class="text-xs text-muted mt-1">Marked as submitted on: ${formatDate(log.lateSubmissionDate)}</p>
                        </div>
                    `;
                } else if (log.note) {
                    // Show regular note if not late
                    lateInfoHTML = `<p class="mt-2 text-sm bg-black/10 p-2 rounded">${log.note}</p>`;
                }

                return `
                    <div class="relative pl-8 pb-8">
                        <div class="timeline-item-dot ${log.isLate ? 'bg-red-500' : 'bg-indigo-500'}"></div>
                        <div class="glass-ui p-4 rounded-lg shadow-sm">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="font-semibold">${(service && task) ? `${service.name} #${task.sequence} for ${client?.name}` : '(Info Unavailable)'}</p>
                                    <p class="text-sm text-muted">Completed on ${formatDateTime(log.timestamp)}</p>
                                    <p class="text-sm text-muted mt-1 italic">Task ID: #${log.taskId}</p>
                                </div>
                                <div class="flex flex-col items-end space-y-2">
                                    ${hasPendingUndo ? `<span class="text-xs font-medium text-yellow-400">Undo Pending</span>` : `
                                    <button data-action="request-undo" data-log-id="${log.id}" class="text-xs text-indigo-400 hover:underline">Request Undo</button>
                                    `}
                                </div>
                            </div>
                            ${lateInfoHTML}
                        </div>
                    </div>
                `;
            }).join('');

            const content = `
                <div class="glass-ui p-6 rounded-lg shadow">
                    <div class="relative timeline">
                        ${historyHTML || '<p class="text-muted">You have no work history yet.</p>'}
                    </div>
                    <div class="flex justify-between items-center mt-4 pt-4 border-t" style="border-color: var(--glass-border);">
                        <button data-action="prev-history-page" ${currentPage === 1 ? 'disabled class="opacity-50 cursor-not-allowed px-4 py-2 bg-gray-600 text-white rounded"' : 'class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700"'}>Previous</button>
                        <span class="text-sm font-semibold">Page ${currentPage} of ${totalPages || 1}</span>
                        <button data-action="next-history-page" ${currentPage >= totalPages ? 'disabled class="opacity-50 cursor-not-allowed px-4 py-2 bg-gray-600 text-white rounded"' : 'class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700"'}>Next</button>

        function renderModal(title, formHTML, submitHandler) {
            const modal = document.createElement('div');
            modal.classList.add('modal-backdrop');

            // If no submit handler, don't show the Save button
            const saveButtonHTML = submitHandler ?
                `<button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Save</button>` :
                '';

            modal.innerHTML = `
                <div class="modal-content glass-ui">
                    <h3 class="text-xl font-bold mb-4">${title}</h3>
                    <form id="modal-form"> 
                        ${formHTML}
                        <div class="flex justify-end space-x-4 mt-6">
                            <button type="button" data-action="close-modal" class="px-4 py-2 bg-white/20 text-main rounded-lg hover:bg-white/30">${submitHandler ? 'Cancel' : 'Close'}</button>
                            ${saveButtonHTML}
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);

            const form = modal.querySelector('form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (submitHandler) {
                    const success = await submitHandler(new FormData(e.target));
                    if (success !== false) {
                        closeModal();
                    }
                } else {
                    closeModal(); // Just close if it was a view-only modal and they hit enter
                }
            });
        }

        function renderConfirmModal(title, message, onConfirm) {
            const modal = document.createElement('div');
            modal.id = 'confirm-modal';
            modal.classList.add('modal-backdrop');
            modal.innerHTML = `
                <div class="modal-content glass-ui">
                    <h3 class="text-xl font-bold mb-2">${title}</h3>
                    <p class="text-muted">${message}</p>
                    <div class="flex justify-end space-x-4 mt-6">
                        <button type="button" data-action="close-modal" class="px-4 py-2 bg-white/20 text-main rounded-lg hover:bg-white/30">Cancel</button>
                        <button type="button" id="confirm-action-btn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">Confirm</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('confirm-action-btn').addEventListener('click', () => {
                closeModal();
                onConfirm();
            });
        }

        function closeModal() {
            // Fix: Remove ALL backdrops to prevent piling up
            document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
        }

        // --- CHART CREATION ---
        function createCharts() {
            const chartTextColor = state.theme === 'light-glass' ? '#111827' : '#f9fafb';
            const chartGridColor = state.theme === 'light-glass' ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)';
            Chart.defaults.color = chartTextColor;
            Chart.defaults.borderColor = chartGridColor;

            // Employee Productivity Chart
            const empCtx = document.getElementById('employee-chart')?.getContext('2d');
            if (empCtx) {
                const employees = state.users.filter(u => u.role === 'Employee');
                const empData = {
                    labels: employees.map(e => e.name),
                    datasets: [{
                        label: 'Tasks Completed',
                        data: employees.map(e => state.workLog.filter(l => l.doneBy === e.name).length),
                        backgroundColor: 'rgba(79, 70, 229, 0.7)',
                        borderColor: 'rgba(79, 70, 229, 1)',
                        borderWidth: 1
                    }]
                };
                new Chart(empCtx, { type: 'bar', data: empData, options: { scales: { y: { beginAtZero: true } } } });
            }

            // Client Distribution Chart
            const clientCtx = document.getElementById('client-chart')?.getContext('2d');
            if (clientCtx) {
                const clientData = {
                    labels: state.clients.map(c => c.name),
                    datasets: [{
                        data: state.clients.map(c => {
                            const serviceIds = state.services.filter(s => s.clientId === c.id).map(s => s.id);
                            return state.workLog.filter(l => serviceIds.includes(l.serviceId)).length;
                        }),

        function renderInstantWork() {
            const isAdmin = state.loggedInUser.role === 'Admin';

            // Ensure UI state exists
            if (typeof state.showInstantWorkCalendar === 'undefined') state.showInstantWorkCalendar = false;
            if (!state.instantWorkCalendarViewDate) state.instantWorkCalendarViewDate = new Date(instantWorkDate);
            if (!state.instantWorkFilter) state.instantWorkFilter = 'All'; // 'All', 'Pending', 'Done', 'Late', 'Missed'
            if (!state.instantWorkDateMode) state.instantWorkDateMode = 'Single'; // 'Single', 'Range', 'All'

            // Initialize Range if not set
            if (!state.instantWorkRangeStart) {
                const today = new Date();
                const weekAgo = new Date(today);
                weekAgo.setDate(today.getDate() - 7);
                state.instantWorkRangeStart = weekAgo.toISOString().split('T')[0];
                state.instantWorkRangeEnd = today.toISOString().split('T')[0];
            }


            // --- HELPER: Date String Utility ---
            const toDateStr = (dateObj) => {
                const year = dateObj.getFullYear();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const selectedDateStr = toDateStr(instantWorkDate);

            // --- FILTER TASKS ---
            const allTasks = (state.instantWork || []).sort((a, b) => new Date(a.executionTime) - new Date(b.executionTime));

            let filteredTasks = allTasks;

            // 1. Date Filter
            if (state.instantWorkDateMode === 'Single') {
                filteredTasks = filteredTasks.filter(t => {
                    return toDateStr(new Date(t.executionTime)) === selectedDateStr;
                });
            } else if (state.instantWorkDateMode === 'Range') {
                filteredTasks = filteredTasks.filter(t => {
                    const tDate = toDateStr(new Date(t.executionTime));
                    return tDate >= state.instantWorkRangeStart && tDate <= state.instantWorkRangeEnd;
                });
            }
            // 'All' mode shows everything

            // 2. User Permission Filter
            if (!isAdmin) {
                filteredTasks = filteredTasks.filter(t => t.assignedTo === state.loggedInUser.id);
            }

            // 3. Status Filter (Applied AFTER Date/User for valid drill-down)
            // But for STATS, we need the counts of the tasks *filtered by date/user*, regardless of the *status dropdown*.
            const statsBase = filteredTasks;

            // Calculate Stats for the CURRENT VIEW (Date + User permissions)
            const stats = {
                all: statsBase.length,
                pending: statsBase.filter(t => t.status === 'Pending').length,
                done: statsBase.filter(t => t.status === 'Done').length,
                late: statsBase.filter(t => t.status === 'Late').length,
                missed: statsBase.filter(t => t.status === 'Missed').length
            };

            // Now apply Status Filter for DISPLAY
            if (state.instantWorkFilter !== 'All') {
                filteredTasks = filteredTasks.filter(t => t.status === state.instantWorkFilter);
            }

            // --- RENDER HELPERS ---

                const assignedUser = state.users.find(u => u.id === task.assignedTo);

            // --- HELPER: Render Calendar (Full or Mini) ---
            const renderCalendarWidget = () => {
                const viewDate = new Date(state.instantWorkCalendarViewDate);
                const year = viewDate.getFullYear();
                const month = viewDate.getMonth();

                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startDayOfWeek = firstDay.getDay();

                // Navigation Controls
                const navHTML = `
                    <div class="flex justify-between items-center mb-4 px-2">
                        <button data-action="iw-cal-prev" class="p-2 hover:bg-white/10 rounded-full text-white transition-colors">
                            ${ICONS.chevronLeft || '<'}
                        </button>
                        <span class="font-bold text-lg text-white tracking-wide">${viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</span>
                        <button data-action="iw-cal-next" class="p-2 hover:bg-white/10 rounded-full text-white transition-colors">
                            ${ICONS.chevronRight || '>'}
                        </button>
                    </div>
                `;

                // --- TABLE BASED CALENDAR (Fixes 1,3,5 skipping issue) ---
                let calendarTable = '<table class="w-full border-collapse table-fixed">';
                calendarTable += `<thead><tr>
                    ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<th class="p-2 text-center text-xs font-bold text-muted uppercase">${d}</th>`).join('')}
                </tr></thead>`;
                calendarTable += '<tbody><tr>';

                // Empty cells for days before start of month
                for (let i = 0; i < startDayOfWeek; i++) {
                    calendarTable += '<td class="p-1"></td>';
                }

                const todayStr = toDateStr(new Date());
                let currentDayOfWeek = startDayOfWeek;

                for (let d = 1; d <= daysInMonth; d++) {
                    if (currentDayOfWeek === 7) {
                        calendarTable += '</tr><tr>';
                        currentDayOfWeek = 0;
                    }

                    const currentLoopDate = new Date(year, month, d);
                    const loopDateStr = toDateStr(currentLoopDate);
                    const isSelected = loopDateStr === selectedDateStr;
                    const isToday = loopDateStr === todayStr;

                    // Tasks for this specific day
                    const dayTasks = (state.instantWork || []).filter(t => {
                        const tDate = new Date(t.executionTime);
                        return toDateStr(tDate) === loopDateStr && (isAdmin || t.assignedTo === state.loggedInUser.id);
                    });

                    // Indicators
                    const hasPending = dayTasks.some(t => t.status === 'Pending');
                    const hasIssue = dayTasks.some(t => t.status === 'Missed' || t.status === 'Late');
                    const hasDone = dayTasks.some(t => t.status === 'Done');

                    let dotsHTML = '<div class="flex justify-center flex-wrap gap-0.5 mt-1 h-3 overflow-hidden">';
                    if (hasIssue) dotsHTML += `<div class="w-1.5 h-1.5 rounded-full bg-red-400"></div>`;
                    if (hasPending) dotsHTML += `<div class="w-1.5 h-1.5 rounded-full bg-yellow-400"></div>`;
                    if (hasDone) dotsHTML += `<div class="w-1.5 h-1.5 rounded-full bg-green-400"></div>`;
                    dotsHTML += `</div>`;

                    calendarTable += `
                        <td class="p-1 h-20 align-top" data-action="iw-select-date" data-date="${loopDateStr}">
                            <div class="h-full rounded-xl flex flex-col items-center justify-start pt-2 cursor-pointer transition-all border border-transparent relative
                                    ${isSelected ? 'bg-indigo-600 text-white shadow-lg ring-2 ring-white/20' : 'bg-white/5 hover:bg-white/10'}
                                    ${isToday && !isSelected ? 'border-indigo-400/50' : ''}">
                                <span class="text-sm ${isToday || isSelected ? 'font-bold' : ''}">${d}</span>
                                ${dotsHTML}
                            </div>
                        </td>
                    `;
                    currentDayOfWeek++;
                }

                // Fill remaining cells
                while (currentDayOfWeek < 7 && currentDayOfWeek !== 0) {
                    calendarTable += '<td class="p-1"></td>';
                    currentDayOfWeek++;
                }

                calendarTable += '</tr></tbody></table>';

                return `
                    <div class="glass-ui p-4 rounded-xl h-full flex flex-col">
                        ${navHTML}
                        <div class="overflow-auto custom-scrollbar flex-grow">
                            ${calendarTable}
                        </div>
                    </div>
                `;
            };

            // --- MAIN CONTENT ---
            // Determine grid class based on sidebar
            const gridClass = state.showInstantWorkCalendar ? 'grid grid-cols-1 lg:grid-cols-12 gap-6' : 'flex flex-col';
            const contentClass = state.showInstantWorkCalendar ? 'lg:col-span-8' : 'w-full';

            const filteredTaskHTML = filteredTasks.length > 0
                ? filteredTasks.map(createCardHTML).join('')
                : `<div class="p-12 border-2 border-dashed border-white/10 rounded-xl text-center flex flex-col items-center justify-center text-muted">
                     <p class="text-xl font-bold mb-2">No tasks found</p>
                     <p class="text-sm">Try adjusting your filters or date range.</p>
                   </div>`;

            let mainContent = `
                <div class="${gridClass} h-[calc(100vh-280px)]">
                    ${state.showInstantWorkCalendar ? `
                        <div class="lg:col-span-4 h-full hidden lg:block">
                            ${renderCalendarWidget()}

                    <div class="${contentClass} h-full flex flex-col glass-ui rounded-xl overflow-hidden shadow-2xl">

            const pageContent = `
                <div class="h-full flex flex-col">
                    ${headerControls}

                    </div>
                </div>
            `;

            // Attach Event Listeners for Filters after render

                const statusSelect = document.getElementById('iw-status-filter');
                if (statusSelect) {
                    statusSelect.onchange = (e) => {
                        state.instantWorkFilter = e.target.value;
                        renderInstantWork(); // Re-render to sort/filter
                    };
                }
                const startInput = document.getElementById('iw-range-start');
                const endInput = document.getElementById('iw-range-end');
                const applyBtn = document.querySelector('[data-action="apply-iw-range"]');

                if (applyBtn && startInput && endInput) {
                    applyBtn.onclick = () => {
                        state.instantWorkRangeStart = startInput.value;
                        state.instantWorkRangeEnd = endInput.value;
                        renderInstantWork();
                    };
                }
            }, 50);

            renderLayout(pageContent, 'Instant Work');
        }

        function handleAddInstantWork() {

                    const executionDateTime = new Date(`${date}T${time}:00`).toISOString();

                    if (executionDateTime < nowISO) {
                        showToastNotification({ text: 'Cannot schedule an instant task for a time in the past.', type: 'deadline' });

                        if (submitButton) submitButton.disabled = false;
                        return false; // Keep modal open
                    }

                            createdBy: state.loggedInUser.id,
                            createdAt: new Date().toISOString(),

        function handleExportInstantWork() {
            try {
                const tasks = state.instantWork || [];
                if (tasks.length === 0) {
                    showToastNotification({ text: "No instant work data to export." });
                    return;
                }

                // Helper to ensure formatDateTime exists
                const safeFormatDate = (d) => typeof formatDateTime === 'function' ? formatDateTime(d) : new Date(d).toLocaleString();

                const headers = ['ID', 'Title', 'Description', 'Assigned To', 'Created By', 'Status', 'Created At', 'Execution Time', 'Late Note', 'Actual Submission'];
                const csvRows = [headers.join(',')];
                const escapeCsvCell = (cell) => {
                    const str = String(cell ?? '');
                    return str.includes(',') || str.includes('"') || str.includes('\n') ? `"${str.replace(/"/g, '""')}"` : str;
                };

                for (const task of tasks) {
                    const assignedUser = state.users.find(u => u.id === task.assignedTo)?.name || 'N/A';
                    const createdUser = state.users.find(u => u.id === task.createdBy)?.name || 'N/A';

                    const row = [
                        task.id,
                        task.title,
                        task.description,
                        assignedUser,
                        createdUser,
                        task.status,
                        safeFormatDate(task.createdAt),
                        safeFormatDate(task.executionTime),
                        task.lateNote,
                        task.lateSubmissionDate
                    ].map(escapeCsvCell);

                    csvRows.push(row.join(','));
                }

                const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `Evorise_InstantWork_Export_${new Date().toISOString().split('T')[0]}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                logActivity('exported all instant work data.');
                showToastNotification({ text: "Export started successfully.", type: "success" });
            } catch (e) {
                console.error("Export failed:", e);
                alert("Export failed: " + e.message);
            }
        }

                    // Check if the task is now in the past and still pending

        function renderSessionLogs() {
            // Ensure pagination state exists
            if (!state.pagination) state.pagination = {};
            if (!state.pagination.sessionLogs) state.pagination.sessionLogs = 1;

            const itemsPerPage = 50;
            const totalItems = state.sessionLogs.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const currentPage = state.pagination.sessionLogs;

            // Sort and slice
            const sortedLogs = state.sessionLogs.slice().reverse();
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const logsToShow = sortedLogs.slice(startIndex, endIndex);

            const logsHTML = logsToShow.map(log => {
                const loginTime = new Date(log.loginTime);
                const logoutTime = log.logoutTime ? new Date(log.logoutTime) : new Date();
                const durationMs = logoutTime - loginTime;
                const hours = Math.floor(durationMs / 3600000);
                const minutes = Math.floor((durationMs % 3600000) / 60000);
                const duration = `${hours}h ${minutes}m`;

                return `
                    <tr class="border-b" style="border-color: var(--glass-border);">
                        <td class="p-3">${log.userName}</td>
                        <td class="p-3">${formatDateTime(log.loginTime)}</td>
                        <td class="p-3">${log.logoutTime ? formatDateTime(log.logoutTime) : 'Active'}</td>
                        <td class="p-3">${log.logoutTime ? duration : '-'}</td>
                    </tr>
                `;
            }).join('');

            const content = `
                <div class="mb-4 flex justify-end">
                    <button data-action="clear-session-log" class="px-4 py-2 bg-red-600 text-white rounded-lg font-semibold hover:bg-red-700 text-sm">Clear History</button>
                </div>
                <div class="glass-ui rounded-lg shadow overflow-hidden table-container">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs uppercase" style="background-color: var(--hover-bg)">
                            <tr>
                                <th class="p-3">User</th><th class="p-3">Login Time</th>
                                <th class="p-3">Logout Time</th><th class="p-3">Duration</th>
                            </tr>
                        </thead>
                        <tbody>${logsHTML}</tbody>
                    </table>
                </div>
                <div class="flex justify-between items-center mt-4">
                    <button data-action="prev-session-page" ${currentPage === 1 ? 'disabled class="opacity-50 cursor-not-allowed px-4 py-2 bg-gray-600 text-white rounded"' : 'class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700"'}>Previous</button>
                    <span class="text-sm font-semibold">Page ${currentPage} of ${totalPages || 1}</span>
                    <button data-action="next-session-page" ${currentPage >= totalPages ? 'disabled class="opacity-50 cursor-not-allowed px-4 py-2 bg-gray-600 text-white rounded"' : 'class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700"'}>Next</button>
                </div>
            `;
            renderLayout(content, "Session Logs");
        }

        function handleAddSubtask(taskId, text) {
            const task = state.tasks.find(t => t.id === taskId);
            if (task) {
                const newSubtask = {
                    id: Math.max(0, ...task.subtasks.map(st => st.id)) + 1,
                    text,
                    completed: false
                };
                task.subtasks.push(newSubtask);
                saveState();
                closeModal();
                renderTaskDetailsModal(taskId); // Re-render modal content
            }
        }

        function handleToggleSubtask(taskId, subtaskId) {
            const task = state.tasks.find(t => t.id === taskId);
            if (task) {
                const subtask = task.subtasks.find(st => st.id === subtaskId);
                if (subtask) {
                    subtask.completed = !subtask.completed;
                    saveState();
                    closeModal();
                    renderTaskDetailsModal(taskId); // Re-render the modal to ensure UI consistency
                }
            }
        }

        function handleDeleteSubtask(taskId, subtaskId) {
            const task = state.tasks.find(t => t.id === taskId);
            if (task) {
                task.subtasks = task.subtasks.filter(st => st.id !== subtaskId);
                saveState();
                closeModal();
                renderTaskDetailsModal(taskId); // Re-render modal content
            }
        }

        function handleAddComment(taskId, text) {
            const task = state.tasks.find(t => t.id === taskId);
            if (task) {
                const newComment = {
                    id: Math.max(0, ...task.comments.map(c => c.id)) + 1,
                    userId: state.loggedInUser.id,
                    userName: state.loggedInUser.name,
                    text,
                    timestamp: new Date().toISOString()
                };
                task.comments.push(newComment);

                // Handle @mentions
                const mentions = text.match(/@(\w+)/g);
                if (mentions) {
                    const mentionedUsers = new Set(mentions.map(m => m.substring(1).toLowerCase()));
                    mentionedUsers.forEach(username => {
                        const user = state.users.find(u => u.name.toLowerCase() === username);
                        const service = state.services.find(s => s.id === task.serviceId);
                        if (user && user.id !== state.loggedInUser.id) {
                            createNotification({
                                userId: user.id,
                                text: `mentioned you in a comment on task "${service.name} #${task.sequence}".`,
                                link: `kanban?taskId=${task.id}`, // Custom link to open modal later
                                type: 'mention',
                                fromUserId: state.loggedInUser.id
                            });
                        }
                    });
                }

                saveState();
                closeModal();
                renderTaskDetailsModal(taskId); // Re-render modal content
            }
        }

        function handleUpdateProfileDetails(form) {
            const formData = new FormData(form);
            const userToUpdate = state.users.find(u => u.id === state.loggedInUser.id);

            if (userToUpdate) {
                const oldName = userToUpdate.name;
                const newName = formData.get('name').trim();
                const newEmail = formData.get('email').trim().toLowerCase();

                if (!newName || !newEmail) {
                    showToastNotification({ text: 'Name and Email cannot be empty.' });
                    return;
                }

                if (state.users.some(u => u.id !== userToUpdate.id && u.email.toLowerCase() === newEmail)) {
                    showToastNotification({ text: 'This email is already in use by another account.' });
                    return;
                }

                // Update the user object in the main state.users array
                userToUpdate.name = newName;
                userToUpdate.email = newEmail;
                userToUpdate.phone = formData.get('phone');
                userToUpdate.education = formData.get('education');
                userToUpdate.sex = formData.get('sex');
                userToUpdate.imageUrl = formData.get('imageUrl').trim() || null;

                // If name was changed, propagate it to historical/related records
                if (oldName !== newName) {
                    state.workLog.forEach(log => { if (log.doneBy === oldName) { log.doneBy = newName; } });
                    state.undoRequests.forEach(req => { if (req.requestedBy === oldName) { req.requestedBy = newName; } });
                    state.messages.forEach(msg => { if (msg.userName === oldName) { msg.userName = newName; } });

            const thisYear = today.getFullYear();
            const sevenDaysAgo = new Date();

            const headers = ['Name', 'Role', 'Tasks (Last 7 Days)', 'Tasks (This Month)', 'Late (This Month)', 'Total Tasks'];

            };

            for (const emp of employees) {
                const allLogs = state.workLog.filter(log => log.doneBy === emp.name && log.serviceId !== -1);
                const monthlyLogs = allLogs.filter(log => {
                    const logDate = new Date(log.timestamp);
                    return logDate.getMonth() === thisMonth && logDate.getFullYear() === thisYear;
                });
                const weeklyLogs = allLogs.filter(log => new Date(log.timestamp) >= sevenDaysAgo);

                const row = [

                    emp.role,
                    weeklyLogs.length,
                    monthlyLogs.length,

                csvRows.push(row.join(','));

            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);

        function handleLogout(isTimeout = false, isForceLogout = false) { // --- CHANGED signature
            signOut(auth).then(() => {
                console.log("✅ User signed out from Firebase.");
                if ((isTimeout || isForceLogout) && !state.loggedInUser) return;
                // Session tracking
                if (activeSessionId) {
                    const session = (state.sessionLogs || []).find(s => s.id === activeSessionId);
                    if (session) {
                        session.logoutTime = new Date().toISOString();
                    }
                }

                let reason = "logged out.";
                if (isTimeout) reason = "was logged out due to inactivity.";
                if (isForceLogout) reason = "was logged out from all devices.";

                logActivity(reason);
                state.loggedInUser = null;
                activeSessionId = null;
                activeSessionTokenVersion = 0; // Reset
                clearTimeout(inactivityTimer);
                state.currentPage = 'login';
                history.replaceState({ page: 'login' }, '', '#login');
                saveStateImmediate();
                router();

                if (isTimeout) {

                // Fallback for local-only logout if firebase fails
                state.loggedInUser = null;
                router();
            });
        }

        function handleMarkDone(taskId) {
            const taskToComplete = state.tasks.find(t => t.id === taskId);
            if (!taskToComplete) return;

            const service = state.services.find(s => s.id === taskToComplete.serviceId);
            if (!service) return;

            const today = new Date().toISOString().split('T')[0];
            let isLate = false;
            if (service.deadline && today > service.deadline) {
                isLate = true;
            }

            // --- NEW LATE SUBMISSION MODAL ---
            if (isLate) {
                renderModal(`Submit Late Task: ${service.name} #${taskToComplete.sequence}`,
                    `<div classclass="space-y-4">
                        <p class="text-sm text-muted">This task is past its deadline of ${formatDate(service.deadline)}. Please provide a reason for the late submission.</p>

                            <textarea name="note" required rows="4" class="mt-1 w-full p-2 border-none rounded bg-white/20" placeholder="e.g., Client requested a last-minute revision."></textarea>

                            <input type="date" name="lateSubmissionDate" required value="${today}" class="mt-1 w-full p-2 border-none rounded bg-white/20">
                        </div>
                    </div>`,
                    (formData) => {
                        const note = formData.get('note');
                        const lateSubmissionDate = formData.get('lateSubmissionDate');

                        if (!note || !lateSubmissionDate) {
                            showToastNotification({ text: "All fields are required for a late submission.", type: 'deadline' });
                            return false; // Keep modal open
                        }

                        taskToComplete.status = 'done';

                        const newLog = {
                            id: Math.max(0, ...state.workLog.map(l => l.id)) + 1,
                            serviceId: service.id,
                            taskId: taskToComplete.id,
                            doneBy: state.loggedInUser.name,
                            timestamp: new Date().toISOString(),
                            note: note,
                            isLate: true, // <-- NEW PROPERTY
                            lateSubmissionDate: lateSubmissionDate // <-- NEW PROPERTY
                        };
                        state.workLog.push(newLog);
                        logActivity(`completed task #${taskToComplete.id} ('${service.name}') late.`);
                        saveState();
                        router();
                    }
                );
            } else {
                // --- ORIGINAL ON-TIME MODAL ---
                renderModal(`Complete Task: ${service.name} #${taskToComplete.sequence}`,

        function handleUndoDecision(requestId, decision) {
            const request = state.undoRequests.find(r => r.id === requestId);
            if (request) {
                request.status = decision;
                if (decision === 'Approved') {
                    const workLogItem = state.workLog.find(log => log.id === request.workLogId);
                    if (workLogItem) {
                        const taskToRevert = state.tasks.find(t => t.id === workLogItem.taskId);
                        if (taskToRevert) {
                            taskToRevert.status = 'inprogress';
                        }

                        // Remove the log entry
                        state.workLog = state.workLog.filter(log => log.id !== request.workLogId);
                    }
                }
                logActivity(`${decision.toLowerCase()} undo request #${requestId}.`);
                saveState();
                router();
            }

            <div><label class="block text-sm font-medium">Role</label><select name="role" ${!isAdmin ? 'disabled' : ''} class="mt-1 w-full p-2 border-none rounded bg-white/20 ${!isAdmin ? 'bg-black/20' : ''}"><option value="Employee" ${user.role === 'Employee' ? 'selected' : ''}>Employee</option><option value="Admin" ${user.role === 'Admin' ? 'selected' : ''}>Admin</option></select></div>
            ${adminFields}
            </div>`,
                (formData) => {
                    const newName = formData.get('name').trim();
                    const newEmail = formData.get('email').trim().toLowerCase();

                    if (state.users.some(u => u.id !== user.id && u.email.toLowerCase() === newEmail)) {
                        renderConfirmModal('Error', `A user with the email "${newEmail}" already exists.`, () => handleEditUser(userId));
                        return false;
                    }

                    logActivity(`edited user '${user.name}'.`);

                    const oldName = user.name;
                    user.name = newName;
                    user.email = newEmail;
                    user.phone = formData.get('phone');
                    user.education = formData.get('education');
                    user.sex = formData.get('sex');

                    if (isAdmin) {
                        user.role = formData.get('role');
                        user.joiningDate = formData.get('joiningDate') || null;
                        user.closingDate = formData.get('closingDate') || null;
                    }

                    if (oldName !== newName) {
                        state.workLog.forEach(log => { if (log.doneBy === oldName) log.doneBy = newName; });
                        state.undoRequests.forEach(req => { if (req.requestedBy === oldName) req.requestedBy = newName; });
                        state.messages.forEach(msg => { if (msg.userName === oldName) msg.userName = newName; });
                        state.calendarEvents.forEach(event => { if (event.createdBy === oldName) event.createdBy = newName; });
                        state.passwordResetRequests.forEach(req => { if (req.userName === oldName) req.userName = newName; });
                    }

                    if (state.loggedInUser && state.loggedInUser.id === user.id) {
                        Object.assign(state.loggedInUser, user);
                    }

                    saveState();
                    router();
                });
        }

        function handleDeleteUser(userId) {

                state.users = state.users.filter(u => u.id !== userId);

        function handleGenerateReport() {
            // Robust check: If we are on the reports page, use filters. Otherwise, default to 'all'.
            const empEl = document.getElementById('report-employee');
            const clientEl = document.getElementById('report-client');
            const startEl = document.getElementById('report-date-start');
            const endEl = document.getElementById('report-date-end');

            const filters = {
                employee: empEl ? empEl.value : 'all',
                client: clientEl ? clientEl.value : 'all',
                startDate: startEl ? startEl.value : '',
                endDate: endEl ? endEl.value : '',
            };

            let filteredLogs = state.workLog.filter(log => log.serviceId !== -1);

            if (filters.employee !== 'all') filteredLogs = filteredLogs.filter(log => log.doneBy === filters.employee);
            if (filters.client !== 'all') {
                const clientServices = state.services.filter(s => s.clientId == filters.client).map(s => s.id);
                filteredLogs = filteredLogs.filter(log => clientServices.includes(log.serviceId));
            }
            if (filters.startDate) filteredLogs = filteredLogs.filter(log => new Date(log.timestamp) >= new Date(filters.startDate));
            if (filters.endDate) {
                const endDate = new Date(filters.endDate);
                endDate.setHours(23, 59, 59, 999);
                filteredLogs = filteredLogs.filter(log => new Date(log.timestamp) <= endDate);
            }

            state.reportData = filteredLogs;
            renderReportResults();
        }

        function handleDownloadCSV() {
            if (state.reportData.length === 0) return;
            const headers = ['Client', 'Service', 'Completed By', 'Date', 'Note'];
            const csvRows = [headers.join(',')];
            const escapeCsvCell = (cell) => {
                const str = String(cell ?? '');
                return str.includes(',') || str.includes('"') || str.includes('\n') ? `"${str.replace(/"/g, '""')}"` : str;
            };
            for (const log of state.reportData) {
                const service = state.services.find(s => s.id === log.serviceId);
                const client = service ? state.clients.find(c => c.id === service.clientId) : null;
                if (!client) continue;
                const row = [client.name, service.name, log.doneBy, formatDateTime(log.timestamp), log.note].map(escapeCsvCell);
                csvRows.push(row.join(','));
            }
            const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Evorise_Report.csv';
            link.click();
        }

            xml += '<Row><Cell><Data ss:Type="String">Generated: ' + new Date().toLocaleString() + '</Data></Cell></Row>';

        function renderNotifications() {
            const panel = document.getElementById('notification-panel');
            const notifications = state.notifications.filter(n => n.userId === state.loggedInUser.id)
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            const NOTIFICATION_ICONS = {
                mention: ICONS.atSign,
                assignment: ICONS.userCheck,

            };

            const notificationsHTML = notifications.map(n => {
                const icon = NOTIFICATION_ICONS[n.type] || ICONS.bell;
                const fromUser = n.fromUserId ? state.users.find(u => u.id === n.fromUserId) : null;
                const title = fromUser ? `${fromUser.name} ` : '';

                // Priority Styling
                const isUrgent = n.type === 'deadline' || n.text.toLowerCase().includes('urgent');

                    <span class="font-semibold">Notifications</span>
                    <div class="flex gap-2">

                <div class="p-3 border-t border-glass-border">

                        <span>✨</span>
                        <span>Ask NOVA to Summarize</span>
                    </button>
                </div>` : ''}`;

        function handleReadNotification(notifId) {
            const notification = state.notifications.find(n => n.id === notifId);
            if (notification) {
                notification.read = true;

                // Sync with Bubble
                if (state.loggedInUser.bubbleSettings) {
                    state.loggedInUser.bubbleSettings.notifications = state.loggedInUser.bubbleSettings.notifications.filter(n => n.id !== notifId);
                    state.loggedInUser.bubbleSettings.unreadCount = Math.max(0, state.loggedInUser.bubbleSettings.unreadCount - 1);
                }

                saveState();

                // Navigate
                const link = notification.link;
                if (!link) { router(); return; }

                if (link.includes('taskId=')) {
                    // Extract Task ID if present
                    const urlParams = new URLSearchParams(link.split('?')[1]);
                    const taskId = urlParams.get('taskId');
                    if (taskId) {
                        state.currentPage = 'kanban';
                        state.taskToOpen = parseInt(taskId);
                    } else {
                        state.currentPage = link.split('?')[0];
                    }
                } else {
                    state.currentPage = link;
                }
                router();
            }
        }

        function handleDeleteNotification(notifId) {
            state.notifications = state.notifications.filter(n => n.id !== notifId);
            // Also remove from bubble if present (simple sync until full refactor)
            if (state.loggedInUser.bubbleSettings) {
                state.loggedInUser.bubbleSettings.notifications = state.loggedInUser.bubbleSettings.notifications.filter(n => n.id !== notifId);
                state.loggedInUser.bubbleSettings.unreadCount = state.notifications.filter(n => n.userId === state.loggedInUser.id && !n.read).length;
            }
            saveStateImmediate();
            // Don't re-render full router, just update the panel if open
            renderNotifications();
            // Update bubble count helper if needed, or router() will catch it eventually
            renderNotificationBubble();
            // We can call router() to be safe for badge updates elsewhere
            router();
        }

                'Are you sure you want to delete all your notifications? This cannot be undone.',

                    // Filter out only the logged-in user's notifications
