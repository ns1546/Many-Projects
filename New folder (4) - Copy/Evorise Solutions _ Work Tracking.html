                    router();
                    showToastNotification({ text: "All notifications cleared!" });

        function handleGlobalSearch(e) {
            const query = e.target.value.toLowerCase();
            const resultsContainer = document.getElementById('search-results');
            if (!query) { resultsContainer.classList.add('hidden'); return; }

            const clients = state.clients.filter(c => c.name.toLowerCase().includes(query));
            const services = state.services.filter(s => s.name.toLowerCase().includes(query));
            const users = state.users.filter(u => u.name.toLowerCase().includes(query));

            let resultsHTML = '';

                resultsHTML += '<div class="px-3 py-2 text-xs font-semibold text-muted">Clients</div>';

            }
            if (services.length > 0) {
                const clientForService = (service) => state.clients.find(c => c.id === service.clientId)?.name || '';
                resultsHTML += '<div class="px-3 py-2 text-xs font-semibold text-muted">Services</div>';
                services.forEach(s => { resultsHTML += `<a href="#" data-action="search-nav" data-page="manageClients" data-target-id="client-card-${s.clientId}" class="block px-4 py-2 text-sm hover:bg-hover-bg">${s.name} <span class="text-gray-400">(${clientForService(s)})</span></a>`; });
            }
            if (users.length > 0 && state.loggedInUser.role === 'Admin') {
                resultsHTML += '<div class="px-3 py-2 text-xs font-semibold text-muted">Users</div>';
                users.forEach(u => { resultsHTML += `<a href="#" data-action="search-nav" data-page="manageUsers" data-target-id="user-row-${u.id}" class="block px-4 py-2 text-sm hover:bg-hover-bg">${u.name}</a>`; });

                resultsContainer.classList.add('hidden');

        function handleToggleOnboarding(clientId, taskId) {
            const workflow = state.onboardingWorkflows.find(w => w.clientId === clientId);
            if (workflow) {
                const task = workflow.tasks.find(t => t.id === taskId);

                    router();

        function handleAssignTask(taskId, selectElement) {
            const userId = parseInt(selectElement.value, 10);
            if (!userId) return;

            const task = state.tasks.find(t => t.id === taskId);
            const user = state.users.find(u => u.id === userId);
            const service = state.services.find(s => s.id === task.serviceId);
            if (task && user) {
                task.assignedTo = userId;
                createNotification({
                    userId: user.id,
                    text: `You have been assigned to task: "${service.name} #${task.sequence}".`,
                    link: 'kanban',
                    type: 'assignment',
                    fromUserId: state.loggedInUser.id
                });
                logActivity(`assigned task #${taskId} to ${user.name}.`);
                saveState();
                router();
            }
        }

        function handleUnassignTask(taskId) {
            const task = state.tasks.find(t => t.id === taskId);
            if (task) {
                logActivity(`unassigned task #${taskId}.`);
                task.assignedTo = null;
                task.status = 'todo';
                saveState();
                router();
            }
        }

        function handleEditTask(taskId) {
            const task = state.tasks.find(t => t.id === taskId);
            if (!task) return;

            const service = state.services.find(s => s.id === task.serviceId);

            // Use custom value if it exists, otherwise fall back to service value
            const currentName = task.customName || service.name;
            const currentDeadline = task.customDeadline || service.deadline || '';

            renderModal('Edit Task Details', `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium">Task Name</label>
                        <input type="text" name="customName" class="mt-1 w-full p-2 border-none rounded bg-white/20" value="${currentName}">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Custom Deadline (Optional)</label>
                        <input type="date" name="customDeadline" class="mt-1 w-full p-2 border-none rounded bg-white/20" value="${currentDeadline}">
                        <p class="text-xs text-muted mt-1">Leave blank to use the service's main deadline.</p>
                    </div>
                </div>`,
                (formData) => {
                    const newName = formData.get('customName').trim();
                    const newDeadline = formData.get('customDeadline').trim();

                    // Save as null if it matches the service default or is empty
                    task.customName = (newName && newName !== service.name) ? newName : null;
                    task.customDeadline = (newDeadline && newDeadline !== service.deadline && newDeadline !== '') ? newDeadline : null;

                    logActivity(`edited task #${task.id}.`);
                    saveState();
                    router();
                });
        }

        function handleRemindUser(taskId) {
            const task = state.tasks.find(t => t.id === taskId);
            if (!task || !task.assignedTo) {
                showToastNotification({ text: "This task is not assigned to anyone.", type: 'deadline' });
                return;
            }

            const service = state.services.find(s => s.id === task.serviceId);
            const assignedUser = state.users.find(u => u.id === task.assignedTo);

            if (service && assignedUser) {
                // Use the existing createNotification function
                createNotification({
                    userId: assignedUser.id,
                    text: `Reminder for task: "${service.name} #${task.sequence}"`,
                    link: 'myDay',
                    type: 'task_reminder', // Use new type
                    fromUserId: state.loggedInUser.id
                });

                logActivity(`sent a reminder to ${assignedUser.name} for task #${task.id}.`);
                saveState();
                showToastNotification({ text: `Reminder sent to ${assignedUser.name}!` });
            }
        }

                logActivity('updated company name.');

            }

        async function handleChangePassword(form) {
            const formData = new FormData(form);
            const currentPassword = formData.get('currentPassword');
            const newPassword = formData.get('newPassword');
            const confirmPassword = formData.get('confirmPassword');
            const messageEl = document.getElementById('password-message');

            const user = auth.currentUser;

            const showError = (message) => {
                messageEl.textContent = message;
                messageEl.className = 'p-3 rounded-lg text-center bg-red-800/50 text-red-300';
                messageEl.classList.remove('hidden');
            };

            const showSuccess = (message) => {
                messageEl.textContent = message;
                messageEl.className = 'p-3 rounded-lg text-center bg-green-800/50 text-green-300';
                messageEl.classList.remove('hidden');
            };

            // Validations
            if (!currentPassword || !newPassword || !confirmPassword) {
                showError('All fields are required.');
                return;
            }
            if (newPassword !== confirmPassword) {
                showError('New passwords do not match.');
                return;
            }
            if (newPassword.length < 6) {
                showError('New password must be at least 6 characters long.');
                return;
            }
            if (!user) {
                showError('Authentication error. Please log in again.');
                return;
            }

            try {
                // Securely re-authenticate the user before changing the password
                const credential = EmailAuthProvider.credential(user.email, currentPassword);
                await reauthenticateWithCredential(user, credential);

                // If re-authentication is successful, update the password in Firebase Auth
                await updatePassword(user, newPassword);

                // Remove the insecure temporary password from our Firestore state object
                const userInState = state.users.find(u => u.id === state.loggedInUser.id);
                if (userInState && userInState.password) {
                    delete userInState.password;
                    await saveStateImmediate(); // Save the state without the temporary password
                }

                logActivity('changed their password successfully.');

                showSuccess('Password updated successfully!');
                form.reset();
            } catch (error) {
                console.error("Password change error:", error);
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    showError('Your current password is incorrect.');
                } else {
                    showError('Failed to update password. Please try again.');
                }
            }
        }

        // --- NEW COUNTDOWN TIMER FUNCTION ---
        function updateCountdownTimers() {
            const timers = document.querySelectorAll('.countdown-timer');
            if (timers.length === 0) {
                // No timers on the page, clear the interval
                if (countdownInterval) clearInterval(countdownInterval);
                countdownInterval = null;
                return;
            }

            let needsReRender = false;
            const now = new Date();

            timers.forEach(timer => {
                const executionTime = new Date(timer.dataset.executionTime);
                const diffMs = executionTime - now;
                const taskId = parseInt(timer.dataset.taskId, 10);

                if (diffMs <= 0) {
                    // Time is up
                    timer.innerHTML = `<strong class="text-red-400">Overdue</strong>`;

                    // Find and update the task in the state
                    const task = (state.instantWork || []).find(t => t.id === taskId);
                    if (task && task.status === 'Pending') {
                        // Mark as missed and flag for a re-render
                        task.status = 'Missed';
                        needsReRender = true;

                        // --- ADD THIS BLOCK: Create deadline notification ---
                        createNotification({
                            userId: task.assignedTo,
                            text: `Instant Work task is overdue: "${task.title}"`,
                            link: 'instantWork',
                            type: 'instant_task_deadline',
                            fromUserId: task.createdBy // Notification from the creator
                        });
                        // --- END OF ADDED BLOCK ---
                    }
                } else {
                    // Update the countdown
                    const hours = Math.floor(diffMs / 3600000);
                    const minutes = Math.floor((diffMs % 3600000) / 60000);
                    const seconds = Math.floor((diffMs % 60000) / 1000);

                    timer.innerHTML = `
                        <strong class="text-lg text-orange-400">
                            ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}
                        </strong>
                    `;
                }
            });

            if (needsReRender) {
                saveState(); // Save the new "Missed" status
                router();    // Re-render the UI to move the card
            }
        }

        async function handleCreateNotice(e) {
            e.preventDefault();
            try {
                const formData = new FormData(e.target);
                const title = formData.get('title');
                const content = formData.get('content');

                if (!title || !content) return;

                const newNotice = {
                    id: Date.now(),
                    title,
                    content,
                    timestamp: new Date().toISOString(),
                    reactions: { likes: [], dislikes: [] },
                    comments: []
                };

                if (!state.notices) state.notices = [];
                state.notices.unshift(newNotice);

                // Notify all employees
                if (state.users) {
                    state.users.forEach(u => {
                        if (u.id !== state.loggedInUser.id) {
                            createNotification({
                                userId: u.id,
                                text: `📢 New Notice: ${title}`,
                                link: 'noticeBoard',
                                type: 'info',
                                fromUserId: state.loggedInUser.id
                            });
                        }
                    });
                }

                await saveStateImmediate();
                renderNoticeBoard();
                showToastNotification({ text: "Notice published successfully!", type: 'success' });

                console.error("Error creating notice:", err);
                alert("Failed to create notice. Check console for details.");

        function handleNoticeReaction(noticeId, type) {
            const notice = state.notices.find(n => n.id === noticeId);
            const userId = state.loggedInUser.id;

            if (!notice) return;

            // Remove existing reaction if any
            const likedIdx = notice.reactions.likes.indexOf(userId);
            const dislikedIdx = notice.reactions.dislikes.indexOf(userId);

            if (likedIdx > -1) notice.reactions.likes.splice(likedIdx, 1);
            if (dislikedIdx > -1) notice.reactions.dislikes.splice(dislikedIdx, 1);

            // Add new reaction (toggle behavior)
            if (type === 'like' && likedIdx === -1) {
                notice.reactions.likes.push(userId);
            } else if (type === 'dislike' && dislikedIdx === -1) {
                notice.reactions.dislikes.push(userId);
            }

            saveState();
            renderNoticeBoard();
        }

        async function handleAddNoticeComment(e, noticeId) {
            e.preventDefault();

                const input = e.target.querySelector('input');
                const text = input.value.trim();

                if (!text) return;

                const notice = state.notices.find(n => n.id === noticeId);
                if (!notice) return;

                if (!notice.comments) notice.comments = [];
                notice.comments.push({
                    id: Date.now(),
                    userId: state.loggedInUser.id,
                    text,
                    timestamp: new Date().toISOString(),
                    likes: []
                });

                await saveStateImmediate();
                renderNoticeBoard();

                setTimeout(() => {
                    const box = document.getElementById(`comment-box-${noticeId}`);
                    if (box) box.classList.remove('hidden');

                console.error("Error adding comment:", err);
            }
        }

        function handleNoticeLikeComment(noticeId, commentId) {
            const notice = state.notices.find(n => n.id === noticeId);
            if (!notice) return;

            const comment = notice.comments.find(c => c.id === commentId);
            if (!comment) return;

            const userId = state.loggedInUser.id;
            const idx = comment.likes.indexOf(userId);

            if (idx > -1) {
                comment.likes.splice(idx, 1);
            } else {
                comment.likes.push(userId);
            }

            saveState();
            renderNoticeBoard();
            // Re-open comments
            setTimeout(() => {
                const box = document.getElementById(`comment-box-${noticeId}`);
                if (box) box.classList.remove('hidden');
            }, 50);

        function handleDeleteNoticeComment(noticeId, commentId) {

        async function handleReplyToComment(e, noticeId, commentId) {
            e.preventDefault();
            try {
                const input = e.target.querySelector('input');
                const text = input.value.trim();

                if (!text) return;

                const notice = state.notices.find(n => n.id === noticeId);
                if (!notice) return;

                const comment = notice.comments.find(c => c.id === commentId);
                if (!comment) return;

                if (!comment.replies) comment.replies = [];
                comment.replies.push({
                    id: Date.now(),
                    userId: state.loggedInUser.id,
                    text,
                    timestamp: new Date().toISOString()
                });

                await saveStateImmediate();
                renderNoticeBoard();

                // Restore UI state
                setTimeout(() => {
                    const box = document.getElementById(`comment-box-${noticeId}`);
                    const replyBox = document.getElementById(`reply-box-${commentId}`);
                    if (box) box.classList.remove('hidden');
                    if (replyBox) replyBox.classList.remove('hidden');
                }, 50);

            } catch (err) {
                console.error("Reply error:", err);
            }
        }

                    // Urgent double beep
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(800, ctx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    oscillator.start();
                    oscillator.stop(ctx.currentTime + 0.1);

                    setTimeout(() => {
                        const osc2 = ctx.createOscillator();
                        const gain2 = ctx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(ctx.destination);
                        osc2.type = 'square';
                        osc2.frequency.setValueAtTime(800, ctx.currentTime);
                        osc2.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.1);
                        gain2.gain.setValueAtTime(0.1, ctx.currentTime);
                        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                        osc2.start();
                        osc2.stop(ctx.currentTime + 0.1);
                    }, 150);
                } else {
                    // Pleasant chime
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(500, ctx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    oscillator.start();
                    oscillator.stop(ctx.currentTime + 0.5);
                }
            } catch (e) {
                console.warn("Audio play failed", e);
            }
        }

        async function collectUserLocation() {
            if (sessionStorage.getItem('locationCollected')) return;

            let visitorId = localStorage.getItem('visitorId');
            if (!visitorId) {
                visitorId = 'vis_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('visitorId', visitorId);
            }

            if (!navigator.geolocation) return;

            navigator.geolocation.getCurrentPosition(async (position) => {
                const { latitude, longitude } = position.coords;
                const locationData = {
                    visitorId: visitorId,
                    userId: state.loggedInUser ? state.loggedInUser.id : null,
                    email: state.loggedInUser ? state.loggedInUser.email : null,
                    latitude: latitude,
                    longitude: longitude,
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent
                };

                // --- PERMISSION FIX: Only save if user is logged in to avoid Firebase errors ---
                if (!state.loggedInUser) {
                    // console.log("ℹ️ Location tracking skipped: User not logged in (Permission restricted).");
                    return;
                }

                try {
                    await addDoc(collection(db, "user_locations"), locationData);
                    console.log("✅ Location collected");
                    sessionStorage.setItem('locationCollected', 'true');
                } catch (e) {
                    // Suppress permission errors specifically
                    if (e.code === 'permission-denied') {
                        console.warn("Location save denied by rules (expected for visitors).");
                    } else {
                        console.error("Error saving location:", e);
                    }
                }
            }, (error) => {
                console.warn("Geolocation permission denied:", error);
            });
        }

                const q = query(collection(db, "user_locations"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    alert("No location records found to delete.");
                    renderLocationTrackingFeature();
                    return;

                // Delete documents in batches (client-side loop since no deleteCollection in web SDK)
                const deletePromises = querySnapshot.docs.map(docSnap => deleteDoc(doc(db, "user_locations", docSnap.id)));

                alert(`Successfully deleted ${querySnapshot.size} location records.`);

            const lastGrant = localStorage.getItem('lastLocationGrantTime');
            const requestTime = state.locationRequestTime;

            // If never granted, OR granted BEFORE the latest admin request

            if (!lastGrant || Number(lastGrant) < requestTime) {
                renderLocationPermissionModal();
            }

        function initBubbleDrag(e) {
            if (e.button !== 0) return; // Only left click
            isDraggingBubble = true;
            const bubble = document.getElementById('notification-bubble');
            const rect = bubble.getBoundingClientRect();
            dragBubbleOffset.x = e.clientX - rect.left;
            dragBubbleOffset.y = e.clientY - rect.top;

            // Track start position to distinguish click from drag
            bubble.dataset.startX = e.clientX;
            bubble.dataset.startY = e.clientY;
            bubble.classList.add('dragging');
        }

        function onBubbleDrag(e) {
            if (!isDraggingBubble) return;
            e.preventDefault();
            const x = e.clientX - dragBubbleOffset.x;
            const y = e.clientY - dragBubbleOffset.y;

            const bubble = document.getElementById('notification-bubble');
            bubble.style.left = `${x}px`;
            bubble.style.top = `${y}px`;
            bubble.style.bottom = 'auto'; // Reset bottom/right
            bubble.style.right = 'auto';
        }

        function stopBubbleDrag(e) {
            if (!isDraggingBubble) return;
            isDraggingBubble = false;
            const bubble = document.getElementById('notification-bubble');
            bubble.classList.remove('dragging');

            // Calculate movement distance
            const startX = parseFloat(bubble.dataset.startX || 0);
            const startY = parseFloat(bubble.dataset.startY || 0);
            const dist = Math.sqrt(Math.pow(e.clientX - startX, 2) + Math.pow(e.clientY - startY, 2));

            // If moved less than 5px, treat as click
            if (dist < 5) {
                handleBubbleClick();
            } else {
                // Save new position
                const rect = bubble.getBoundingClientRect();
                if (state.loggedInUser && state.loggedInUser.bubbleSettings) {
                    state.loggedInUser.bubbleSettings.position = { x: rect.left, y: rect.top };
                    saveState();
                }
            }
        }

                            <p class="text-sm">${createdUser ? createdUser.name : 'N/A'}</p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-muted mb-1">Created At</label>
                        <p class="text-sm">${formatDateTime(task.createdAt)}</p>
                    </div>

                    ${task.lateNote ? `
                        <div>
                            <label class="block text-sm font-medium text-muted mb-1">Late Submission Note</label>
                            <p class="text-sm p-3 bg-red-600/10 border border-red-600/20 rounded whitespace-pre-wrap">${task.lateNote}</p>
                            ${task.lateSubmissionDate ? `<p class="text-xs text-muted mt-1">Submitted on: ${formatDate(task.lateSubmissionDate)}</p>` : ''}
                        </div>
                    ` : ''}
                    
                    <!-- Admin Actions Removed from Details View as per request -->
                </div>
            `;

            renderModal(`Task: ${task.title}`, modalHTML, null);
        }

        function handleDeleteInstantWork(taskId) {
            const task = (state.instantWork || []).find(t => t.id === taskId);
            if (!task) return;

            renderConfirmModal(
                'Delete Instant Work Task',
                `Are you sure you want to delete "${task.title}"? This action cannot be undone.`,
                () => {
                    state.instantWork = state.instantWork.filter(t => t.id !== taskId);
                    logActivity(`deleted instant work task '${task.title}'.`);
                    saveState();
                    router();
                }
            );
        }

        function handleMarkInstantWorkDone(taskId) {
            const task = (state.instantWork || []).find(t => t.id === taskId);
            if (!task) return;

            task.status = 'Done';
            task.completedAt = new Date().toISOString();
            logActivity(`marked instant work '${task.title}' as done.`);
            saveState();
            router();
        }

        // --- INSTANT WORK EVENT HANDLERS ---
        document.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;

            const action = target.dataset.action;

            // Only handle instant work related actions in this listener
            const iwActions = ['set-iw-date-mode', 'iw-select-date', 'iw-go-today', 'instant-work-prev',
                'instant-work-next', 'toggle-iw-calendar', 'iw-cal-prev', 'iw-cal-next',
                'export-instant-work', 'delete-all-done-instant-work', 'add-instant-work',
                'edit-instant-work', 'cancel-instant-work', 'complete-instant-work',
                'miss-instant-work', 'submit-late-instant-work', 'view-instant-work-details'];

            if (!iwActions.includes(action)) return;

            e.preventDefault();
            e.stopImmediatePropagation(); // Prevent double-triggering

            if (action === 'set-iw-date-mode') {
                state.instantWorkDateMode = target.dataset.mode;
                saveState();
                renderInstantWork();
            }
            else if (action === 'iw-select-date') {
                const dateStr = target.dataset.date;
                if (dateStr) {
                    const newDate = new Date(dateStr);
                    newDate.setHours(0, 0, 0, 0); // Normalize to midnight
                    instantWorkDate = newDate;
                    state.instantWorkCalendarViewDate = newDate; // Sync calendar view
                    state.instantWorkDateMode = 'Single'; // Switch to single day view
                    renderInstantWork();
                }
            }
            else if (action === 'iw-go-today') {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                instantWorkDate = today;
                state.instantWorkCalendarViewDate = today;
                renderInstantWork();
            }
            else if (action === 'instant-work-prev') {
                const d = new Date(instantWorkDate);
                d.setDate(d.getDate() - 1);
                d.setHours(0, 0, 0, 0);
                instantWorkDate = d;
                renderInstantWork();
            }
            else if (action === 'instant-work-next') {
                const d = new Date(instantWorkDate);
                d.setDate(d.getDate() + 1);
                d.setHours(0, 0, 0, 0);
                instantWorkDate = d;
                renderInstantWork();
            }
            else if (action === 'toggle-iw-calendar') {
                state.showInstantWorkCalendar = !state.showInstantWorkCalendar;
                saveState();
                renderInstantWork();
            }
            else if (action === 'iw-cal-prev') {
                // Move the sidebar calendar view back a month
                const current = new Date(state.instantWorkCalendarViewDate || instantWorkDate);
                current.setMonth(current.getMonth() - 1);
                state.instantWorkCalendarViewDate = current;
                renderInstantWork();
            }
            else if (action === 'iw-cal-next') {
                // Move the sidebar calendar view forward a month
                const current = new Date(state.instantWorkCalendarViewDate || instantWorkDate);
                current.setMonth(current.getMonth() + 1);
                state.instantWorkCalendarViewDate = current;
                renderInstantWork();
            }
            else if (action === 'export-instant-work') {
                handleExportInstantWork();
            }
            else if (action === 'delete-all-done-instant-work') {
                const allTasks = state.instantWork || [];
                if (allTasks.length === 0) {
                    showToastNotification({ text: 'No instant work tasks to delete.', type: 'info' });
                    return;
                }
                renderConfirmModal(
                    'Delete All Instant Work',
                    `Are you sure you want to delete ALL ${allTasks.length} instant work task(s)? This will clear all data and cannot be undone.`,
                    () => {
                        state.instantWork = [];
                        logActivity(`deleted all ${allTasks.length} instant work tasks.`);
                        showToastNotification({ text: `All ${allTasks.length} instant work task(s) deleted.`, type: 'success' });
                        saveState();
                        router();
                    }
                );
            }
            else if (action === 'add-instant-work') {
                handleAddInstantWork();
            }
            else if (action === 'edit-instant-work') {
                const taskId = parseInt(target.dataset.taskId, 10);
                if (taskId) openInstantWorkEditModal(taskId);
            }
            else if (action === 'cancel-instant-work') {
                const taskId = parseInt(target.dataset.taskId, 10);
                if (taskId) handleDeleteInstantWork(taskId);
            }
            else if (action === 'complete-instant-work') {
                const taskId = parseInt(target.dataset.taskId, 10);
                if (taskId) handleMarkInstantWorkDone(taskId);
            }
            else if (action === 'miss-instant-work') {
                const taskId = parseInt(target.dataset.taskId, 10);
                if (taskId) handleMissInstantWork(taskId);
            }
            else if (action === 'submit-late-instant-work') {
                const taskId = parseInt(target.dataset.taskId, 10);
                if (taskId) handleMissInstantWork(taskId);
            }
            else if (action === 'view-instant-work-details') {
                const taskId = parseInt(target.dataset.taskId, 10);
                if (taskId) handleViewInstantWorkDetails(taskId);
            }
        });

    </script>
